server:
  port: 8080

spring:
  application:
    name: astro-engine
  config:
    # Optional local secrets: engine/.env (KEY=VALUE lines, git-ignored). Real env vars still win.
    import: optional:file:./.env[.properties]
  cache:
    type: simple          # in-memory; switch to caffeine/redis in production
  jackson:
    default-property-inclusion: non_null

astro:
  cors:
    origins: http://localhost:3000,http://localhost:3001
  cache:
    # Caches hold birth data, readings and questions: cleared hourly (GDPR storage limitation). Readings are
    # keyed by date, so a day change never serves yesterday's text.
    clear-ms: 3600000
  llm:
    provider: ${ASTRO_LLM_PROVIDER:anthropic}        # anthropic | openrouter
    api-key: ${ASTRO_LLM_API_KEY:}                  # empty = template narrator only
    model: ${ASTRO_LLM_MODEL:}                      # empty = per-provider default (see LlmProperties)
    fallback-model: ${ASTRO_LLM_FALLBACK_MODEL:}    # tried when the main model errors or times out
    base-url: ${ASTRO_LLM_BASE_URL:}                # empty = per-provider default
    timeout-ms: ${ASTRO_LLM_TIMEOUT_MS:30000}       # per call; thinking models need the headroom (the web tier waits 40 s)
    daily-token-ceiling: ${ASTRO_LLM_DAILY_TOKENS:0}  # 0 = unlimited; when reached, readings use templates, answer/chat return 503
    max-tokens-reading: ${ASTRO_LLM_MAX_TOKENS_READING:400}
    max-tokens-answer: ${ASTRO_LLM_MAX_TOKENS_ANSWER:700}
    max-tokens-chat: ${ASTRO_LLM_MAX_TOKENS_CHAT:900}
    reasoning: ${ASTRO_LLM_REASONING:on}           # openrouter: on | low | medium | high | off (hidden thinking of a reasoning model)
    reasoning-tokens: ${ASTRO_LLM_REASONING_TOKENS:1500}  # thinking budget added on top of each max-tokens-* cap

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  # The web tier's request id (X-Request-Id) on every line, so one request can be followed across both logs.
  pattern:
    level: "%5p [rid=%X{rid:--}]"
